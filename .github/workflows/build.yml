name: Build ROM

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: gba-wow-rom
          path: gba-wow.gba

  smoke-test:
    # Boots the ROM in a headless mGBA, walks around and saves screenshots.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gba-wow-rom

      - name: Install mGBA library
        run: sudo apt-get update && sudo apt-get install -y libmgba-dev python3-pil

      - name: Run
        run: |
          cc -O2 -o mgba_script tools/headless/mgba_script.c -lmgba
          mkdir -p screenshots
          ./mgba_script gba-wow.gba \
            wait:40 shot:screenshots/1_title.ppm \
            hold:A:2 wait:30 shot:screenshots/2_creation.ppm \
            hold:A:2 wait:4 hold:A:2 wait:6 shot:screenshots/2_creation_spec.ppm \
            hold:A:2 wait:4 hold:A:2 wait:40 shot:screenshots/3_start.ppm \
            hold:A:2 wait:4 hold:A:2 wait:4 shot:screenshots/4_quest.ppm \
            hold:A:2 wait:30 hold:S:2 wait:4 hold:l:2 wait:4 hold:l:2 wait:4 hold:l:2 wait:4 \
            shot:screenshots/5_quest_log.ppm \
            hold:r:2 wait:10 shot:screenshots/5_world_map.ppm \
            hold:B:2 wait:4 hold:R:70 hold:D:40 hold:R:110 hold:A:2 wait:150 shot:screenshots/6_combat.ppm \
            hold:r:20 shot:screenshots/7_action_bar.ppm \
            wait:4 hold:S:2 wait:4 hold:r:2 wait:4 hold:r:2 wait:6 shot:screenshots/8_character.ppm \
            hold:l:2 wait:4 hold:D:2 wait:4 hold:A:2 wait:4 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:90 shot:screenshots/9_stormwind.ppm \
            hold:S:2 wait:4 hold:D:2 wait:4 hold:A:2 wait:4 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:90 shot:screenshots/10_stockade.ppm
          # A level 12 hero saved by the version 3 game (M11) must load, pick a subclass (the one with the
          # most talent points is preselected) and be saved again as version 4.
          python3 -c "d = open('tools/headless/saves/v3_dwarf_hunter_12.sav', 'rb').read(); open('old.sav', 'wb').write(d + b'\xff' * (32768 - len(d)))"
          python3 tools/headless/check_save.py old.sav version=3 level=12
          MGBA_SAVE=old.sav ./mgba_script gba-wow.gba \
            wait:40 shot:screenshots/11_old_save.ppm \
            hold:A:2 wait:30 shot:screenshots/11_old_save_spec.ppm \
            hold:A:2 wait:4 hold:A:2 wait:60 hold:S:2 wait:6 shot:screenshots/12_old_save_character.ppm
          python3 tools/headless/check_save.py old.sav version=4 race=Dwarf class=Hunter level=12 money=100000 \
            subclass=Marksmanship
          # A level 20 Frost mage saved before the Utility and Buffs bars: loading moves Blink and Polymorph
          # to Utility and the armor, intellect, conjures and Teleport to Buffs. Then the bags get loot.
          python3 -c "d = open('tools/headless/saves/v4_human_frost_mage_20.sav', 'rb').read(); open('bars.sav', 'wb').write(d + b'\xff' * (32768 - len(d)))"
          python3 tools/headless/check_save.py bars.sav level=20 subclass=Frost combat=7 bag_rows=3
          MGBA_SAVE=bars.sav ./mgba_script gba-wow.gba \
            wait:40 hold:A:2 wait:80 hold:l:20 shot:screenshots/13_utility_bar.ppm \
            wait:4 hold:lr:20 shot:screenshots/14_buffs_bar.ppm wait:4 hold:E:20 shot:screenshots/15_items_bar.ppm \
            wait:4 hold:S:2 wait:6 hold:l:2 wait:6 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:4 hold:U:2 wait:3 hold:U:2 wait:3 hold:U:2 wait:3 hold:U:2 wait:3 hold:U:2 wait:3 \
            hold:U:2 wait:3 hold:A:2 wait:10 hold:r:2 wait:4 hold:r:2 wait:6 shot:screenshots/16_bags.ppm
          python3 tools/headless/check_save.py bars.sav level=20 combat=4 utility=2 buffs=5 sort=Type
          # The hunter teleports to Fargodeep Mine and shoots a Kobold Tunneler, who throws its candle: a cast
          # bar over its head and the cast's name under the target frame, then the fire hit.
          MGBA_SAVE=old.sav ./mgba_script gba-wow.gba \
            wait:40 hold:A:2 wait:80 hold:S:2 wait:6 hold:l:2 wait:6 hold:D:2 wait:4 hold:A:2 wait:6 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:A:2 wait:90 \
            hold:A:2 wait:80 shot:screenshots/17_enemy_cast.ppm wait:60 shot:screenshots/18_enemy_cast_hit.ppm
          # The hunter meets Thor at Sentinel Hill, then flies there from Stormwind (Dungar charges for the
          # flight) and looks at the continent map.
          MGBA_SAVE=old.sav ./mgba_script gba-wow.gba \
            wait:40 hold:A:2 wait:80 hold:S:2 wait:6 hold:l:2 wait:6 hold:D:2 wait:4 hold:A:2 wait:6 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:D:2 wait:3 hold:A:2 wait:90 hold:A:2 wait:30 shot:screenshots/19_flight_discovered.ppm \
            hold:B:2 wait:10 hold:S:2 wait:6 hold:D:2 wait:4 hold:A:2 wait:6 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:90 hold:A:2 wait:30 shot:screenshots/20_flight_master.ppm \
            hold:A:2 wait:200 shot:screenshots/21_flight.ppm wait:600 shot:screenshots/22_landed.ppm \
            hold:S:2 wait:6 hold:l:2 wait:10 hold:B:2 wait:10 shot:screenshots/23_continent_map.ppm \
            hold:r:2 wait:6 hold:A:2 wait:10 hold:B:2 wait:10
          python3 tools/headless/check_save.py old.sav flights=2 money=99885
          # A Beast Mastery hunter on Taming the Beast tames a young wolf east of Northshire Abbey, which
          # then follows them and bites what they shoot. The pet is saved.
          python3 -c "d = open('tools/headless/saves/v4_dwarf_beast_hunter_12.sav', 'rb').read(); open('pet.sav', 'wb').write(d + b'\xff' * (32768 - len(d)))"
          MGBA_SAVE=pet.sav ./mgba_script gba-wow.gba \
            wait:40 hold:A:2 wait:80 hold:S:2 wait:6 hold:l:2 wait:6 hold:D:2 wait:4 hold:A:2 wait:6 \
            hold:A:2 wait:90 hold:R:120 hold:D:50 hold:l:10 hold:lB:3 hold:l:4 wait:200 \
            shot:screenshots/24_taming.ppm wait:360 shot:screenshots/25_pet.ppm \
            hold:R:6 hold:RA:2 hold:R:4 wait:50 shot:screenshots/26_pet_fights.ppm \
            hold:S:2 wait:10 hold:A:2 wait:10 hold:S:2 wait:10
          python3 tools/headless/check_save.py pet.sav subclass="Beast Mastery" pet=1
          # The hunter and the wolf take the Deeprun Tram from Stormwind Station to Ironforge Station.
          MGBA_SAVE=pet.sav ./mgba_script gba-wow.gba \
            wait:40 hold:A:2 wait:80 hold:S:2 wait:6 hold:l:2 wait:6 hold:D:2 wait:4 hold:A:2 wait:6 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:90 hold:U:100 wait:120 shot:screenshots/27_tram.ppm wait:260 \
            shot:screenshots/28_ironforge_station.ppm hold:S:2 wait:10 hold:A:2 wait:10 hold:S:2 wait:10
          python3 tools/headless/check_save.py pet.sav map=10 pet=1
          python3 -c "import glob; from PIL import Image; [Image.open(f).save(f[:-4] + '.png') for f in glob.glob('screenshots/*.ppm')]"
          rm screenshots/*.ppm

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
