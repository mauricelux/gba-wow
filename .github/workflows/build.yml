name: Build ROM

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: gba-wow-rom
          path: gba-wow.gba

  smoke-test:
    # Boots the ROM in a headless mGBA, walks around and saves screenshots.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gba-wow-rom

      - name: Install mGBA library
        run: sudo apt-get update && sudo apt-get install -y libmgba-dev python3-pil

      - name: Run
        run: |
          cc -O2 -o mgba_script tools/headless/mgba_script.c -lmgba
          mkdir -p screenshots
          ./mgba_script gba-wow.gba \
            wait:40 shot:screenshots/1_title.ppm \
            hold:A:2 wait:30 shot:screenshots/2_creation.ppm \
            hold:A:2 wait:4 hold:A:2 wait:4 hold:A:2 wait:40 shot:screenshots/3_start.ppm \
            hold:A:2 wait:4 hold:A:2 wait:4 shot:screenshots/4_quest.ppm \
            hold:A:2 wait:30 hold:S:2 wait:4 hold:l:2 wait:4 hold:l:2 wait:4 hold:l:2 wait:4 \
            shot:screenshots/5_quest_log.ppm \
            hold:r:2 wait:10 shot:screenshots/5_world_map.ppm \
            hold:B:2 wait:4 hold:R:70 hold:D:40 hold:R:110 hold:A:2 wait:150 shot:screenshots/6_combat.ppm \
            hold:r:20 shot:screenshots/7_action_bar.ppm \
            wait:4 hold:S:2 wait:4 hold:r:2 wait:4 hold:r:2 wait:6 shot:screenshots/8_character.ppm \
            hold:l:2 wait:4 hold:D:2 wait:4 hold:A:2 wait:4 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:90 shot:screenshots/9_stormwind.ppm \
            hold:S:2 wait:4 hold:D:2 wait:4 hold:A:2 wait:4 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 hold:D:2 wait:3 \
            hold:A:2 wait:90 shot:screenshots/10_stockade.ppm
          # A level 12 hero saved by the version 3 game (M11) must load and be saved again as version 4.
          python3 -c "d = open('tools/headless/saves/v3_dwarf_hunter_12.sav', 'rb').read(); open('old.sav', 'wb').write(d + b'\xff' * (32768 - len(d)))"
          python3 tools/headless/check_save.py old.sav version=3 level=12
          MGBA_SAVE=old.sav ./mgba_script gba-wow.gba \
            wait:40 shot:screenshots/11_old_save.ppm \
            hold:A:2 wait:60 hold:S:2 wait:6 shot:screenshots/12_old_save_character.ppm
          python3 tools/headless/check_save.py old.sav version=4 race=Dwarf class=Hunter level=12 money=100000
          python3 -c "import glob; from PIL import Image; [Image.open(f).save(f[:-4] + '.png') for f in glob.glob('screenshots/*.ppm')]"
          rm screenshots/*.ppm

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
