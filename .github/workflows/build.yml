name: Build ROM

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: gba-wow-rom
          path: gba-wow.gba

  smoke-test:
    # Boots the ROM in a headless mGBA, walks around and saves screenshots.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gba-wow-rom

      - name: Install mGBA library
        run: sudo apt-get update && sudo apt-get install -y libmgba-dev python3-pil

      - name: Run
        run: |
          cc -O2 -o mgba_script tools/headless/mgba_script.c -lmgba
          mkdir -p screenshots
          ./mgba_script gba-wow.gba \
            wait:30 shot:screenshots/1_start.ppm \
            hold:D:60 hold:L:60 shot:screenshots/2_walk.ppm \
            hold:D:40 hold:A:2 wait:150 shot:screenshots/3_combat.ppm \
            hold:r:20 shot:screenshots/4_action_bar.ppm
          python3 -c "import glob; from PIL import Image; [Image.open(f).save(f[:-4] + '.png') for f in glob.glob('screenshots/*.ppm')]"
          rm screenshots/*.ppm

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
